name: Part 2 - Build and Test API

on:
  push:
    branches: [ main ]
    paths:
      - 'Part2/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'Part2/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Part2/RaceDay.Api.slnx

      - name: Build
        run: dotnet build Part2/RaceDay.Api.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Part2/RaceDay.Api.slnx --no-build --configuration Release --verbosity normal